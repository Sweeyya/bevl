# Security checks: known-vulnerable dependencies and unsafe workflow patterns.
# Runs on PRs, on main, and weekly (new advisories appear without any code change).

name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/setup

      - name: Audit production and dev dependencies (high and above)
        run: pnpm audit --audit-level=high

  workflows:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor (medium and above)
        run: pipx run zizmor==1.32.0 --offline --min-severity medium .github
