# Release workflow.
# Runs only on pushes to main (i.e. after a PR merges).
# Uses changesets/action to either:
#   (a) open a "Release packages" PR that bumps versions + updates CHANGELOG, or
#   (b) publish to npm if that PR is what just merged.
#
# npm trusted publishing with provenance means no npm token is stored here.
# See RELEASING.md for the one-time manual setup required before first publish.

name: Release

on:
  push:
    branches: [main]

# Needs write access to open the release PR and push the version bump commit.
permissions:
  contents: write
  pull-requests: write
  id-token: write # for npm provenance

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false # never cancel a release mid-flight

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/setup

      - name: Build before publishing
        run: pnpm build

      - name: Create release PR or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish: pnpm release
          title: "Release packages"
          commit: "Release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
