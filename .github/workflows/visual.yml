# Screenshot tests.
# Runs `pnpm test:visual` on ubuntu-latest and compares with the linux baselines
# in tools/__screenshots__/linux/. Those baselines are only ever made on the
# same runner type, by the "Update visual baselines" workflow
# (update-visual-baselines.yml). Missing baselines fail the job.
#
# Only runs when runtime packages or examples change.
# On failure: uploads pixel-diff PNGs as an artifact.

name: Visual

on:
  pull_request:
    paths:
      - "packages/core/**"
      - "packages/effects/**"
      - "packages/a11y/**"
      - "packages/tokens/**"
      - "examples/**"
      - "tools/**"
      - ".github/workflows/visual.yml"
  push:
    branches: [main]
    paths:
      - "packages/core/**"
      - "packages/effects/**"
      - "packages/a11y/**"
      - "packages/tokens/**"
      - "examples/**"
      - "tools/**"

permissions: {}

concurrency:
  group: visual-${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  visual:
    name: Screenshot tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/setup

      - name: Install Playwright Chromium
        run: pnpm --filter @doodley/check exec playwright install chromium --with-deps

      - name: Build
        run: pnpm build

      - name: Screenshot tests
        run: pnpm test:visual

      - name: Upload pixel diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs-${{ github.run_id }}
          path: tools/__screenshots__/_results/
          retention-days: 14
          if-no-files-found: ignore
