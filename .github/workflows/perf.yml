# Performance tests (Lighthouse CI).
# Runs against built examples on a phone-profile Lighthouse audit.
# Budgets are in lighthouserc.json; TESTING.md section 6 explains each number.
#
# Only runs when runtime packages or examples change — not on every PR.
# Slow (~5 min); kept off the main CI path so it doesn't block quick fixes.
#
# Pattern: separate slow workflows with paths: filters, learned from Vite and Biome.

name: Perf

on:
  pull_request:
    types: [labeled, synchronize, reopened]
    paths:
      - "packages/core/**"
      - "packages/effects/**"
      - "packages/a11y/**"
      - "packages/tokens/**"
      - "packages/optimizer/**"
      - "examples/**"
      - "lighthouserc.json"
      - "tools/**"
      - "doodley.budgets.json"
      - ".github/workflows/perf.yml"
  push:
    branches: [main]
    paths:
      - "packages/core/**"
      - "packages/effects/**"
      - "packages/a11y/**"
      - "packages/tokens/**"
      - "packages/optimizer/**"
      - "examples/**"
      - "tools/**"
      - "lighthouserc.json"
  workflow_dispatch:

permissions: {}

concurrency:
  group: perf-${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  perf:
    name: Lighthouse CI
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/setup

      - name: Install Playwright Chromium
        run: pnpm --filter @doodley/check exec playwright install chromium --with-deps

      - name: Build
        run: pnpm build

      - name: Run Lighthouse CI
        # Builds and serves each example, then runs lhci with lighthouserc.json.
        run: pnpm test:perf

      # Upload the full Lighthouse report on failure so you can inspect it.
      - name: Upload Lighthouse report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ github.run_id }}
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
